<!DOCTYPE html>
<html>
<head>
    <title>Submit Vulnerability Report</title>
</head>
<body>
    <h1>Submit Vulnerability Report</h1>
    <p>Please provide enough technical detail for PSIRT triage.</p>

    <form method="post" action="/submit">
        <p>
            <label>Vulnerability Title:</label><br>
            <input type="text" name="title" required>
        </p>

        <p>
            <label>Affected Product:</label><br>
            <input type="text" name="product" required>
        </p>

        <p>
            <label>Hardware Version:</label><br>
            <input type="text" name="hardware_version" required>
        </p>

        <p>
            <label>Firmware Version:</label><br>
            <input type="text" name="firmware_version" required>
        </p>

        <p>
            <label>Country of Tested Device:</label><br>
            <input type="text" name="tested_country">
        </p>

        <p>
            <label>CVSS 4.0 Score:</label><br>
            <input type="number" name="cvss_score" min="0" max="10" step="0.1">
        </p>

        <p>
            <label>Description:</label><br>
            <textarea name="description" rows="5" cols="70" required></textarea>
        </p>

        <p>
            <label>Impact:</label><br>
            <textarea name="impact" rows="4" cols="70"></textarea>
        </p>

        <p>
            <label>Reproduction Steps:</label><br>
            <textarea name="reproduction_steps" rows="6" cols="70"></textarea>
        </p>

        <p>
            <label>Recommended Mitigation:</label><br>
            <textarea name="recommended_mitigation" rows="4" cols="70"></textarea>
        </p>

        <p>
            <label>Reporter Contact:</label><br>
            <input type="email" name="reporter_contact">
        </p>

        <button type="submit">Submit Report</button>
    </form>

    <p><a href="/">Back to Home</a></p>
</body>
</html>
